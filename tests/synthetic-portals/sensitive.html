<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sensitive eligibility</title></head>
<body>
<h1>Engineer - Careful Corp</h1>
<form id="app">
  <h2>Contact</h2>
  <label for="n">Full name</label><input id="n" type="text" name="n">
  <label for="e">Email</label><input id="e" type="email" name="e">
  <h2>Eligibility</h2>
  <fieldset id="spons">
    <legend>Will you now or in the future require visa sponsorship?</legend>
    <label><input type="radio" name="sponsor" value="yes"> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label>
  </fieldset>
  <label for="auth">Are you legally authorized to work in this country?</label>
  <select id="auth" name="auth"><option value="">--</option><option>Yes</option><option>No</option></select>
  <label for="gender">Gender</label>
  <select id="gender" name="gender"><option value="">--</option><option>Female</option><option>Male</option><option>Prefer not to say</option></select>
  <label for="vet">Veteran status</label>
  <select id="vet" name="vet"><option value="">--</option><option>Yes</option><option>No</option></select>
  <label for="dis">Disability status</label>
  <select id="dis" name="dis"><option value="">--</option><option>Yes</option><option>No</option></select>
  <label for="race">Race / Ethnicity</label>
  <select id="race" name="race"><option value="">--</option><option>A</option><option>B</option></select>
  <label for="crim">Have you ever been convicted of a crime?</label>
  <input id="crim" type="text" name="crim">
  <label for="sal">Expected salary</label>
  <input id="sal" type="text" name="sal">
  <label for="dob">Date of birth</label>
  <input id="dob" type="date" name="dob">
  <label><input type="checkbox" id="consent" name="consent"> I certify that the information above is true and I agree to the terms and conditions</label>
  <button id="submit" type="submit">Submit</button>
</form>
<script src="/_common.js"></script>
</body></html>
