<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Basic application</title></head>
<body>
<h1>Software Engineer Intern - Basic Co</h1>
<form id="app" action="/submit" method="post">
  <h2>Personal Information</h2>
  <label for="fullname">Full Name *</label>
  <input id="fullname" name="fullname" type="text" required>
  <label for="email">Email Address</label>
  <input id="email" name="email" type="email" required>
  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel">
  <label for="city">City</label>
  <input id="city" name="city" type="text">
  <label for="country">Country</label>
  <select id="country" name="country">
    <option value="">Select...</option>
    <option value="IN">India</option>
    <option value="US">United States</option>
    <option value="GB">United Kingdom</option>
  </select>
  <label for="linkedin">LinkedIn</label>
  <input id="linkedin" name="linkedin" type="url">
  <label for="github">GitHub</label>
  <input id="github" name="github" type="url">
  <h2>Education</h2>
  <label for="school">University</label>
  <input id="school" name="school" type="text">
  <label for="degree">Degree</label>
  <input id="degree" name="degree" type="text">
  <label for="gradyear">Graduation Year</label>
  <input id="gradyear" name="gradyear" type="text">
  <button id="submit" type="submit">Submit Application</button>
</form>
<script src="/_common.js"></script>
</body></html>
