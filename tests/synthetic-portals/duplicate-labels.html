<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Duplicate labels</title></head>
<body>
<h1>Analyst - Duplicate Labels Inc</h1>
<form id="app">
  <h2>Applicant</h2>
  <label for="a-name">Name</label>
  <input id="a-name" name="applicant_name" type="text">
  <label for="a-email">Email</label>
  <input id="a-email" name="applicant_email" type="email">
  <label for="a-email2">Confirm email</label>
  <input id="a-email2" name="applicant_email2" type="email">
  <h2>Professional Reference</h2>
  <label for="r-name">Name</label>
  <input id="r-name" name="ref_name" type="text">
  <label for="r-email">Email</label>
  <input id="r-email" name="ref_email" type="email">
  <label for="r-phone">Phone</label>
  <input id="r-phone" name="ref_phone" type="tel">
  <h2>Other</h2>
  <label for="x1">City</label>
  <input id="x1" name="city_a" type="text">
  <label for="x2">City</label>
  <input id="x2" name="city_b" type="text">
  <button id="submit" type="submit">Submit</button>
</form>
<script src="/_common.js"></script>
</body></html>
