<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Same label in several sections</title></head>
<body>
<h1>Associate - Many Sections LLC</h1>
<form id="app">
  <h2>Personal Information</h2>
  <label for="a-name">Name</label><input id="a-name" type="text" name="a_name">
  <label for="a-email">Email</label><input id="a-email" type="email" name="a_email">
  <label for="a-city">City</label><input id="a-city" type="text" name="a_city">
  <h2>Previous School</h2>
  <label for="s-name">Name</label><input id="s-name" type="text" name="s_name">
  <label for="s-city">City</label><input id="s-city" type="text" name="s_city">
  <h2>Reference 1</h2>
  <label for="r1-name">Name</label><input id="r1-name" type="text" name="r1_name">
  <label for="r1-email">Email</label><input id="r1-email" type="email" name="r1_email">
  <h2>Emergency Contact</h2>
  <label for="em-name">Name</label><input id="em-name" type="text" name="em_name">
  <label for="em-email">Email</label><input id="em-email" type="email" name="em_email">
  <button id="submit" type="submit">Submit</button>
</form>
<script src="/_common.js"></script>
</body></html>
