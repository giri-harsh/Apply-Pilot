<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sensitive and open-ended questions</title></head>
<body>
<h1>Machine Learning Intern</h1>
<div class="company-name">Northwind Analytics</div>
<form id="app">
  <label for="n">Full name</label><input id="n" name="n" type="text">
  <label for="why">Why do you want to join us? (max 70 words)</label>
  <textarea id="why" name="why" rows="4"></textarea>
  <label for="gender">Describe your gender identity</label>
  <textarea id="gender" name="gender" rows="2"></textarea>
  <label for="visa">Will you require visa sponsorship now or in the future? Please explain</label>
  <textarea id="visa" name="visa" rows="2"></textarea>
  <label for="legal">I certify that the information in this application is true and complete. Add any comments</label>
  <textarea id="legal" name="legal" rows="2"></textarea>
  <label for="strengths">What are your greatest strengths? (max 50 words)</label>
  <textarea id="strengths" name="strengths" rows="3"></textarea>
  <label><input type="checkbox" id="agree" name="agree"> I agree to the terms and conditions</label>
  <button id="submit" type="submit">Submit Application</button>
</form>
<script src="/_common.js"></script>
</body></html>
